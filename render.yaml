services:
  - type: web
    name: miysara-ahmed
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: cd client && npm install --include=dev && npm run build && cd ../server && npm install
    startCommand: cd server && node src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: miysara-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/server/data
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
